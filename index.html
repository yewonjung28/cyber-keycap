<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KEYCAP / Press Test</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#f6f0f3;color:#352e35;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}#app{position:fixed;inset:0;touch-action:none;cursor:pointer}header{position:absolute;top:32px;left:36px;z-index:2;font-weight:800;font-size:13px;letter-spacing:.13em;pointer-events:none}.badge{position:absolute;right:36px;top:32px;font-size:11px;color:#9d8795;z-index:2;pointer-events:none}footer{position:absolute;bottom:32px;left:0;width:100%;text-align:center;z-index:2;font-size:12px;letter-spacing:.08em;pointer-events:none}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b77fa3;margin-right:8px;vertical-align:middle}canvas{display:block;width:100%;height:100%}#error{display:none;position:absolute;left:10%;right:10%;top:45%;text-align:center;z-index:4;line-height:1.7;font-size:14px} @media(max-width:600px){header{top:22px;left:20px}.badge{top:22px;right:20px}footer{bottom:24px}}
</style></head><body><header>KEYCAP<span style="color:#bb8aa9">®</span></header><div class="badge">FOUR KEYS / 004</div><div id="app"></div><div id="error">모델을 불러오지 못했어요.<br>웹 서버에서 열거나 배포한 주소에서 확인해 주세요.</div><footer><span class="dot"></span>PRESS &amp; HOLD ANY KEY</footer>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
const host=document.getElementById('app');const scene=new THREE.Scene();scene.background=new THREE.Color('#f6f0f3');const camera=new THREE.OrthographicCamera(-3.8,3.8,3.8,-3.8,.1,100);camera.position.set(0,9,3.5);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ffffff','#a08d9c',.65));const light=new THREE.DirectionalLight('#ffffff',1.4);light.position.set(-3,7,5);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-6;light.shadow.camera.right=6;light.shadow.camera.top=6;light.shadow.camera.bottom=-6;light.shadow.bias=-.0003;light.shadow.radius=5;scene.add(light);
new RGBELoader().load('./studio.hdr',texture=>{texture.mapping=THREE.EquirectangularReflectionMapping;scene.environment=texture;scene.environmentIntensity=2.4;document.querySelector('.badge').textContent='STUDIO HDRI LOADED / 005';},undefined,error=>(console.error('HDRI load failed:',error),document.querySelector('.badge').textContent='STUDIO HDRI ERROR / 005'));

const rig=new THREE.Group();scene.add(rig);
const keys=[];const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
let activePointer=null;
const glowColor=new THREE.Color('#ff8cde');
new GLTFLoader().load('./Four_keycaps.glb',g=>{
 const root=g.scene;rig.add(root);
 const allBox=new THREE.Box3().setFromObject(root);
 const size=allBox.getSize(new THREE.Vector3()),center=allBox.getCenter(new THREE.Vector3());
 root.position.sub(center);
 const scale=3.8/Math.max(size.x,size.z);
 rig.scale.setScalar(scale);
 rig.position.y=-allBox.min.y*scale+.08;
 // Each key is independent; its base and light remain stationary.
 for(let i=1;i<=4;i++){
  const key=root.getObjectByName('Key'+i),base=root.getObjectByName('Base'+i),led=root.getObjectByName('Light'+i);
  if(!key||!base||!led){console.warn('Missing components for key',i);continue}
  const emissive=[];
  key.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;
   const original=Array.isArray(o.material)?o.material:[o.material];
   const clones=original.map(m=>{const clone=m.clone();if(clone.emissive&&clone.emissiveIntensity>0){emissive.push({material:clone,intensity:clone.emissiveIntensity});clone.emissiveIntensity=0;}return clone});
   o.material=Array.isArray(o.material)?clones:clones[0];
  });
  const leds=[];
  led.traverse(o=>{if(o.isMesh){o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone();const materials=Array.isArray(o.material)?o.material:[o.material];for(const m of materials){if(m.emissive){leds.push({material:m,intensity:Math.max(m.emissiveIntensity||0,2)});m.emissiveIntensity=0}m.transparent=true;m.opacity=0;}o.visible=false;}});
  led.visible=false;
  base.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.castShadow=true;}});
  // LED light source exists in the web scene, independent of Blender light exports.
  const bounds=new THREE.Box3().setFromObject(key),mid=bounds.getCenter(new THREE.Vector3());
  const lamp=new THREE.PointLight(glowColor,0,Math.max(size.x,size.z)*.55,2);
  lamp.position.set(mid.x,bounds.min.y-.015,mid.z);
  root.add(lamp);
  keys.push({key,led,lamp,emissive,leds,rest:key.position.y,press:0,target:0});
 }
 document.querySelector('.badge').textContent='4 KEYS READY / 004';
},undefined,e=>{console.error(e);document.getElementById('error').style.display='block'});
function pick(e){
 const r=renderer.domElement.getBoundingClientRect();
 pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 ray.setFromCamera(pointer,camera);
 const hits=ray.intersectObjects(keys.map(k=>k.key),true);
 if(!hits.length)return null;
 return keys.find(k=>{let o=hits[0].object;while(o){if(o===k.key)return true;o=o.parent;}return false})||null;
}
let held=null;
host.addEventListener('pointerdown',e=>{const k=pick(e);if(!k)return;held=k;activePointer=e.pointerId;k.target=1;host.setPointerCapture(e.pointerId);});
function release(e){if(activePointer!==null&&e.pointerId!==activePointer)return;if(held)held.target=0;held=null;activePointer=null;}
host.addEventListener('pointerup',release);host.addEventListener('pointercancel',release);host.addEventListener('lostpointercapture',release);
window.addEventListener('blur',()=>{for(const k of keys)k.target=0;held=null;activePointer=null});
function resize(){
 const w=innerWidth,h=innerHeight,half=3.1;
 camera.left=-half*w/h;camera.right=half*w/h;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();renderer.setSize(w,h);
}
window.addEventListener('resize',resize);resize();
let previous=performance.now();
function frame(t){
 const dt=Math.min((t-previous)/1000,.05);previous=t;
 for(const k of keys){
  k.press+=(k.target-k.press)*(1-Math.exp(-dt*(k.target?22:12)));
  k.key.position.y=k.rest-k.press*.10;
  const v=k.press;
  k.led.visible=v>.015;
  k.led.traverse(o=>{if(o.isMesh)o.visible=v>.015});
  for(const m of k.leds){m.material.emissiveIntensity=m.intensity*v;m.material.opacity=v;}
  for(const m of k.emissive)m.material.emissiveIntensity=m.intensity*v;
  k.lamp.intensity=4*v;
 }
 renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
