<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KEYCAP / Press Test</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#f6f0f3;color:#352e35;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}#app{position:fixed;inset:0;touch-action:none;cursor:pointer}header{position:absolute;top:32px;left:36px;z-index:2;font-weight:800;font-size:13px;letter-spacing:.13em;pointer-events:none}.badge{position:absolute;right:36px;top:32px;font-size:11px;color:#9d8795;z-index:2;pointer-events:none}footer{position:absolute;bottom:32px;left:0;width:100%;text-align:center;z-index:2;font-size:12px;letter-spacing:.08em;pointer-events:none}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b77fa3;margin-right:8px;vertical-align:middle}canvas{display:block;width:100%;height:100%}#error{display:none;position:absolute;left:10%;right:10%;top:45%;text-align:center;z-index:4;line-height:1.7;font-size:14px} @media(max-width:600px){header{top:22px;left:20px}.badge{top:22px;right:20px}footer{bottom:24px}}
</style></head><body><header>KEYCAP<span style="color:#bb8aa9">®</span></header><div class="badge">HDRI VERSION / 002</div><div id="app"></div><div id="error">모델을 불러오지 못했어요.<br>웹 서버에서 열거나 배포한 주소에서 확인해 주세요.</div><footer><span class="dot"></span>PRESS &amp; HOLD THE KEYCAP</footer>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
const host=document.getElementById('app');const scene=new THREE.Scene();scene.background=new THREE.Color('#f6f0f3');const camera=new THREE.OrthographicCamera(-3.8,3.8,3.8,-3.8,.1,100);camera.position.set(0,9,3.5);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ffffff','#a08d9c',.65));const light=new THREE.DirectionalLight('#ffffff',1.4);light.position.set(-3,7,5);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-6;light.shadow.camera.right=6;light.shadow.camera.top=6;light.shadow.camera.bottom=-6;light.shadow.bias=-.0003;light.shadow.radius=5;scene.add(light);
new RGBELoader().load('./studio.hdr',texture=>{texture.mapping=THREE.EquirectangularReflectionMapping;scene.environment=texture;scene.environmentIntensity=2.4;document.querySelector('.badge').textContent='HDRI LOADED / 002';},undefined,error=>(console.error('HDRI load failed:',error),document.querySelector('.badge').textContent='HDRI ERROR / 002'));
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#f6f0f3',roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-.12;floor.receiveShadow=true;scene.add(floor);
const keyRoot=new THREE.Group();scene.add(keyRoot);let key=null,pressed=false,progress=0,restY=.06;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
new GLTFLoader().load('./keycap.glb',g=>{key=g.scene;const box=new THREE.Box3().setFromObject(key),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());key.position.sub(center);keyRoot.add(key);const scale=2.5/Math.max(size.x,size.z);keyRoot.userData.baseScale=scale;keyRoot.scale.setScalar(scale);keyRoot.position.y=size.y*scale/2+.06;restY=keyRoot.position.y;key.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){if(m.isMeshStandardMaterial){m.metalness=1;m.roughness=.17;m.envMapIntensity=1.7;m.needsUpdate=true}}}}});},undefined,e=>{console.error(e);document.getElementById('error').style.display='block'});
function hit(e){if(!key)return false;const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);return ray.intersectObject(keyRoot,true).length>0}
host.addEventListener('pointerdown',e=>{if(hit(e)){pressed=true;host.setPointerCapture(e.pointerId)}});host.addEventListener('pointerup',()=>pressed=false);host.addEventListener('pointercancel',()=>pressed=false);window.addEventListener('blur',()=>pressed=false);
function resize(){const w=innerWidth,h=innerHeight;const half=3.65;camera.left=-half*w/h;camera.right=half*w/h;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();let prev=performance.now();function frame(t){const dt=Math.min((t-prev)/1000,.05);prev=t;progress+=(Number(pressed)-progress)*(1-Math.exp(-dt*(pressed?18:11)));keyRoot.position.y=restY-progress*.20;keyRoot.scale.y=(key?keyRoot.userData.baseScale:1)*(1-progress*.045);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
